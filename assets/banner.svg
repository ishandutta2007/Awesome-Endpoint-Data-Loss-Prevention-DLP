<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for neon glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-font {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    
    /* Subtle Dynamic Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.65; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-20px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatShield {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .scan-line { animation: scanLine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .data-flow { stroke-dasharray: 12, 12; animation: dataStream 4s linear infinite; }
    .shield-float { animation: floatShield 6s ease-in-out infinite; }
    .glow-pulse { animation: pulseGlow 4s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g opacity="0.5">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="180" r="160" fill="#6366f1" filter="url(#glow)" />
    <circle class="orb-1" cx="800" cy="330" r="120" fill="#a855f7" filter="url(#glow)" />
  </g>

  <!-- Futuristic Cyber Circuit / Perimeter Lines -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path class="data-flow" d="M 50 40 L 450 40 L 520 110 L 1150 110" />
    <path class="data-flow" d="M 50 380 L 700 380 L 760 320 L 1150 320" />
    <circle cx="520" cy="110" r="4" fill="#38bdf8" />
    <circle cx="760" cy="320" r="4" fill="#818cf8" />
  </g>

  <!-- Dynamic Security Scanning Grid Simulation (Background Right) -->
  <g transform="translate(860, 95)" opacity="0.65" class="shield-float">
    <!-- Big Security Shield Wireframe -->
    <path d="M 120 20 L 210 60 L 210 160 C 210 230 120 280 120 280 C 120 280 30 230 30 160 L 30 60 Z"
          fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#soft-glow)" />
    
    <!-- Concentric Protection Nodes -->
    <path d="M 120 50 L 185 80 L 185 155 C 185 205 120 245 120 245 C 120 245 55 205 55 155 L 55 80 Z"
          fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Center Icon: Lock & Chip -->
    <rect x="100" y="125" width="40" height="32" rx="6" fill="#0284c7" />
    <path d="M 108 125 L 108 112 C 108 105 113 100 120 100 C 127 100 132 105 132 112 L 132 125"
          fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="120" cy="140" r="3.5" fill="#ffffff" />
    <line x1="120" y1="143.5" x2="120" y2="150" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Dynamic Scanning Radar/Laser line -->
    <line class="scan-line" x1="20" y1="20" x2="220" y2="20" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Status Indicator Pill in Diagram -->
    <rect x="65" y="210" width="110" height="24" rx="12" fill="#090d16" stroke="#22c55e" stroke-width="1.2" />
    <circle cx="78" cy="222" r="4" fill="#22c55e" class="glow-pulse" />
    <text x="88" y="226" fill="#86efac" font-size="11" font-weight="700" class="code-font">EXFIL_BLOCKED</text>
  </g>

  <!-- Left Accent Accent Line -->
  <rect x="75" y="75" width="5" height="150" rx="2.5" fill="url(#cyan-glow)" filter="url(#soft-glow)" />

  <!-- Main Branding Headers (Strictly Foreground with High Contrast) -->
  <g transform="translate(100, 115)">
    <!-- Category Pill -->
    <g transform="translate(0, -32)">
      <rect width="265" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4.5" fill="#38bdf8" class="glow-pulse" />
      <text x="28" y="19" class="badge-text" fill="#7dd3fc" font-size="12">DATA LOSS PREVENTION (DLP)</text>
    </g>

    <!-- Main Title -->
    <text y="35" class="title" fill="url(#text-grad)">Awesome Endpoint DLP</text>

    <!-- Subtitle -->
    <text y="78" class="subtitle">The Curated Cybersecurity &amp; Exfiltration Defense Guide</text>

    <!-- Tagline description -->
    <text y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#64748b" font-weight="400">
      Enterprise SaaS Platforms • Open-Source Redaction Gates • AI Agent Guardrails • Pre-Cloud Egress
    </text>
  </g>

  <!-- Feature Highlights / Capability Pills (Foreground Bottom) -->
  <g transform="translate(100, 305)">
    <!-- Pill 1: Sensitive Data Discovery -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      <rect x="12" y="11" width="20" height="20" rx="5" fill="#0369a1" />
      <text x="22" y="25" fill="#38bdf8" font-size="12" font-weight="900" text-anchor="middle">🔍</text>
      <text x="42" y="26" class="badge-text">Sensitive Data Discovery</text>
    </g>

    <!-- Pill 2: Exfiltration Prevention -->
    <g transform="translate(225, 0)">
      <rect width="205" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      <rect x="12" y="11" width="20" height="20" rx="5" fill="#4338ca" />
      <text x="22" y="25" fill="#818cf8" font-size="12" font-weight="900" text-anchor="middle">🛡️</text>
      <text x="42" y="26" class="badge-text">Exfiltration Prevention</text>
    </g>

    <!-- Pill 3: Pre-Cloud & AI Guardrails -->
    <g transform="translate(445, 0)">
      <rect width="215" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      <rect x="12" y="11" width="20" height="20" rx="5" fill="#701a75" />
      <text x="22" y="25" fill="#f472b6" font-size="12" font-weight="900" text-anchor="middle">⚡</text>
      <text x="42" y="26" class="badge-text">AI &amp; Pre-Cloud Egress</text>
    </g>

    <!-- Pill 4: Open Source & Self-Hosted -->
    <g transform="translate(675, 0)">
      <rect width="215" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      <rect x="12" y="11" width="20" height="20" rx="5" fill="#065f46" />
      <text x="22" y="25" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">💻</text>
      <text x="42" y="26" class="badge-text">Self-Hosted DLP Gates</text>
    </g>
  </g>

  <!-- Outer Neon Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#cyan-glow)" stroke-width="1" stroke-opacity="0.3" />
</svg>
